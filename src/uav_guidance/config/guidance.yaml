guidance_node:
  ros__parameters:
    use_nav_odom: true          
    setpoint_topic: "/guidance/setpoint"
    nav_odom_topic: "/nav/odom"
    sim_odom_topic: "/sim/odom"

    rate_hz: 20.0
    # z_ref: 1.0 # 3D 웨이포인트를 쓰므로 이제 고정 고도는 안 씀 (주석 처리 또는 삭제해도 무방)

    # 모드 설정 파라미터 ("lookahead" or "min_jerk" or "min_snap" or "multi_snap")
    guidance_mode: "multi_snap" 
    # multi_snap_solver:
    #   qp         - snap 비용 ∫(p''''(t))^2 dt를 직접 최소화하는 KKT 기반 QP minimum snap
    #   continuity - 기존 연속 조건 기반 7차 다항식 방식
    multi_snap_solver: "qp"
    
    # 뾰족한 모서리를 잘라내고 진입/진출점을 명시하여 '둥근 사각형' 유도 (칠각형) + 3D 고도 추가
    waypoints_x: [0.0, 4.0, 6.0, 6.0, 4.0, 0.0, -2.0, -2.0, 0.0]
    waypoints_y: [0.0, 0.0, 2.0, 6.0, 8.0, 8.0, 6.0, 2.0, 0.0]
    waypoints_z: [2.0, 1.5, 1.0, 1.5, 2.0, 1.5, 1.0, 1.5, 2.0] # z축 웨이포인트 추가함

    # 6주차 (Look-ahead) 용 파라미터
    accept_radius: 3.0 # 원래 1.0          
    lookahead_dist: 2.0         

    # 7주차 (Polynomial) 용 파라미터
    avg_speed: 0.9 # actuator-level multirotor 모델에서 추종 가능한 평균 속도
    
    hold_last: true

    # [Reference Preview] MPC의 horizon 및 제어 주기 — control.yaml의 mpc_N, dt와 일치시킬 것
    mpc_preview_N: 15      # MPC 예측 horizon 스텝 수
    mpc_preview_dt: 0.01   # MPC 제어 주기 (s)
    reference_log_enabled: true
    reference_log_period_ms: 500
    # planner가 작은 occupancy 변화로 path를 자주 갱신해도 trajectory를 과도하게 리셋하지 않기 위한 안정화 설정
    planner_path_change_threshold_m: 0.8
    planner_retrajectory_min_interval_s: 1.5
    planner_path_prune_radius_m: 1.0
    planner_goal_change_threshold_m: 0.75
    reference_acc_limit_xy: 2.0
    max_yaw_rate_dps: 45.0
    # 마지막 짧은 구간에서 multi-snap 시작/종료 zero-velocity 조건 때문에 reference가 뒤로 휘는 것을 방지
    final_direct_guidance_wp_count: 3
    final_direct_accept_radius: 0.35

    use_planner: true
